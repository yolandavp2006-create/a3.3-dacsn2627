services:
  web:
    image: nginx:1.30
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d:ro
      - codigo:/var/www/html:ro
    ports:
      - "${PORT:-8080}:80"
    networks:
      frontal:
  yourls:
    image: yourls:1.10-fpm
    networks:
      frontal:
      interna:
    volumes:
      - codigo:/var/www/html
    environment:
      - YOURLS_SITE="https://prueba.com"
      - YOURLS_USER=${Y_USER:?Yourls user missing in .env file}
      - YOURLS_PASS=${Y_PASS:?Yourls password missing in .env file}
      - YOURLS_DB_HOST=db
      - YOURLS_DB_USER=${DB_USER:?Database username missing in .env file}
      - YOURLS_DB_PASS=${DB_PASS:?Database password missing in .env file}
      - YOURLS_DB_NAME=${DB_NAME:?Database name missing in .env file}

  db:
networks:
  frontal:
  interna:
volumes:
